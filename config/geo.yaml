# yaml-language-server: $schema=./schemas/geo.schema.json
# ─────────────────────────────────────────────────────────────
#  Geodata for the map and the search area. Files are built under data/geo/ (gitignored)
#  by `findhome geo fetch <dataset>`; nothing here changes scores.
# ─────────────────────────────────────────────────────────────
region:
  name: Stockholm core
  kommuner:                       # SCB municipality code → name
    "0180": Stockholm
    "0184": Solna
    "0183": Sundbyberg
    "0186": Lidingö
    "0162": Danderyd
    "0163": Sollentuna
    "0123": Järfälla
    "0126": Huddinge
    "0182": Nacka
datasets:
  zones:
    source: scb_regso_2025        # SCB RegSO 2025 (CC0), grouped by Stockholm stadsdelsområde from OSM
    wfs_url: https://geodata.scb.se/geoserver/stat/wfs
    type_name: stat:RegSO_2025
    simplify_m: 8
  transit:                        # `findhome geo fetch transit`: SL GTFS when TRAFIKLAB_GTFS_KEY is set, else OSM routes
    order: [gtfs, osm]
    gtfs_url: https://opendata.samtrafiken.se/gtfs/sl/sl.zip
    key_env: TRAFIKLAB_GTFS_KEY
    refresh_days: 7               # Bronze key: 50 static downloads/month
    simplify_m: {rail: 5, bus: 10}
    station_snap_m: 80            # a station serves the lines passing within this distance
  network:                        # `findhome geo fetch network`: streets and paths for walking / cycling times (OSM)
    refresh_days: 30              # raw Overpass answers are reused for this long
    # OSM highway classes a person may walk / cycle on; foot=no, bicycle=no, access=no|private remove a way.
    walk: [footway, path, pedestrian, steps, living_street, residential, service, unclassified, track, cycleway,
           corridor, tertiary, tertiary_link, secondary, secondary_link, primary, primary_link]
    bike: [cycleway, path, living_street, residential, service, unclassified, track, tertiary, tertiary_link,
           secondary, secondary_link, primary, primary_link]
    bike_if_allowed: [footway, pedestrian]   # only with bicycle=yes|designated (gång- och cykelbana)
  timetable:                      # `findhome geo fetch timetable`: lines per stop and departures per hour
    order: [gtfs, osm]            # GTFS reuses transit.gtfs_url and its key (same download); osm: lines only
    day_kinds: [weekday, saturday, sunday]
attribution:
  - "Statistical areas: Source: Statistics Sweden (SCB)"
  - "© OpenStreetMap contributors"
  - "Transit data: Trafiklab.se / Samtrafiken (CC0), when built from GTFS"
