# yaml-language-server: $schema=./schemas/poi.schema.json
# ─────────────────────────────────────────────────────────────
#  Nearby-service categories. OSM tags use key=value (value may be a|b alternatives), key~regex or key!=value;
#  '&' joins conditions on the same element. icon/color draw the map blips (icons: see Map → Legend).
#  provider: overpass (free, default) | google_places (needs a key, see docs/google-apis.md)
#  Fetched region-wide by `findhome geo fetch poi` into data/geo/poi/ (refresh every fetch.refresh_days).
# ─────────────────────────────────────────────────────────────
fetch: {refresh_days: 7}
categories:
  sats: {label: SATS, osm_tags: ["leisure=fitness_centre&brand=SATS", "leisure=fitness_centre&name~^SATS"], radius_m: 1500,
      max_walk_min: 15, weight: 1.0, provider: overpass, icon: dumbbell, color: "#e3000b"}
  grocery: {label: Groceries, osm_tags: ["shop=supermarket|convenience|greengrocer"], radius_m: 800, max_walk_min: 10,
      weight: 1.0, provider: overpass, icon: cart, color: "#2ea44f"}
  metro: {label: Metro, osm_tags: ["station=subway", "railway=station&subway=yes"], radius_m: 1200, max_walk_min: 12,
      weight: 1.0, provider: overpass, icon: metro, color: "#0089ca"}
  commuter_rail: {label: Train, osm_tags: ["railway=station|halt&station!=subway&station!=light_rail&subway!=yes"], radius_m: 1500,
      max_walk_min: 15,
      weight: 0.6, provider: overpass, icon: train, color: "#ec619f"}
  bus_stop: {label: Bus stop, osm_tags: ["highway=bus_stop"], radius_m: 400, max_walk_min: 5, weight: 0.5, provider: overpass,
      icon: bus, color: "#d71d24"}
  park: {label: Park, osm_tags: ["leisure=park|nature_reserve"], radius_m: 800, max_walk_min: 10, weight: 0.6, provider: overpass,
      icon: tree, color: "#3a9d5d"}
  vet: {label: Vet, osm_tags: ["amenity=veterinary"], radius_m: 3000, max_walk_min: 30, weight: 0.5, provider: overpass,
      icon: paw, color: "#f0a95a"}
  pharmacy: {label: Pharmacy, osm_tags: ["amenity=pharmacy"], radius_m: 1000, max_walk_min: 12, weight: 0.3, provider: overpass,
      icon: pill, color: "#0bb5a8"}
  gym: {label: Gym, osm_tags: ["leisure=fitness_centre"], radius_m: 1000, max_walk_min: 12, weight: 0.3, provider: overpass,
      icon: barbell, color: "#8a8aa0"}
