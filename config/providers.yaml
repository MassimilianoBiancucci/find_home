# yaml-language-server: $schema=./schemas/providers.schema.json
# ─────────────────────────────────────────────────────────────
#  External providers. Keys live in config/providers.env (gitignored).
#  Paid providers are off by default. See guide/documentation/providers.md and google-apis.md.
# ─────────────────────────────────────────────────────────────
routing:
  haversine:
    enabled: true
    speeds_kmh: {walk: 4.8, bike: 15, transit: 22, drive: 30}
    detour_factor: 1.3
  osm:
    enabled: true
    modes: [drive]                 # the public OSRM demo only routes cars; walk/bike need self-hosted OSRM or ORS
    osrm_url: https://router.project-osrm.org
    max_requests_per_s: 1
  resrobot:
    enabled: true
    modes: [transit]
    base_url: https://api.resrobot.se/v2.1
    key_env: TRAFIKLAB_RESROBOT_KEY
    # Trafiklab key level, sets the calls per minute: bronze 45 (free, 25,000/month), silver 60, gold 200.
    # A new key starts on a "default" level that may allow fewer than bronze: if calls fail with 429 or
    # connectivity refreshes stop early, set max_calls_per_minute below (it overrides the plan) or request Bronze
    # on the Trafiklab project page (guide/documentation/api_keys.md).
    plan: bronze
    # max_calls_per_minute: 30       # optional override of the plan; spacing between calls is 60 / this value
    retry_delay_s: 5                 # wait after a 429 when the answer has no Retry-After (grows 5 s, 10 s, 15 s)
    max_calls_per_month: 25000       # bronze; informational, not enforced
  google:
    enabled: false
    modes: [transit, drive]
    base_url: https://routes.googleapis.com
    key_env: GOOGLE_MAPS_SERVER_KEY
    max_elements_per_month: 5000
    price_per_1000_usd: 10.0        # assume Pro tier until transit tier is verified
  ors:                              # OpenRouteService: real walking routes (free key: matrix 500/day, 40/min)
    enabled: true
    modes: [walk]
    base_url: https://api.openrouteservice.org
    key_env: ORS_API_KEY
    max_calls_per_minute: 40
mode_priority:
  transit: [resrobot, google, haversine]
  walk: [ors, osm, haversine]
  bike: [osm, haversine]
  drive: [osm, google, haversine]
geocoding:
  order: [nominatim, google]
  nominatim:
    base_url: https://nominatim.openstreetmap.org
    email_env: NOMINATIM_EMAIL
    max_requests_per_s: 1
    countrycodes: se
  suggest:                         # address autocomplete in Locations (Nominatim forbids autocomplete)
    order: [ors, photon]
    ors:
      base_url: https://api.openrouteservice.org
      key_env: ORS_API_KEY
    photon:
      base_url: https://photon.komoot.io
      bbox: [17.6, 59.1, 18.6, 59.6]   # lon/lat box around Stockholm
poi:
  overpass:
    enabled: true
    url: https://overpass-api.de/api/interpreter
  google_places:
    enabled: false
    key_env: GOOGLE_MAPS_SERVER_KEY
budget:
  max_routing_calls_per_run: 500
connectivity:                            # Map → Connectivity refresh (origins × points × windows, ResRobot)
  # stations: each zone's connectivity centroids (stations within a 5 min walk of its homes, `findhome zone centroids`),
  #           each station routed once, zone values derived per home (best walk + transit); ~9,500 calls per full run
  # zone:     one point inside each zone (~2,100 calls; some zone points have no stop nearby)
  origin: stations
  max_calls_per_run: 10000               # a full station refresh fits in one run; Bronze allows 25,000 a month
  # When ResRobot fails 3 times in a row (outage, quota, bad key); a zone point it cannot route is never a reason:
  #   ask      pause the refresh and ask in the UI (the CLI stops instead)
  #   continue keep calling; failed routes stay failed and are retried only with "Retry failed"
  #   estimate straight-line estimates for the rest of the run, tagged as estimates
  # The pause dialog's "don't ask again" writes this value.
  on_provider_failure: ask
cache:
  routing_ttl_days: 30
  geocode_ttl_days: 365
  poi_ttl_days: 90
prefilter:
  max_haversine_km_by_category: {work: 25, partner: 25, transit_hub: 30, generic: 40}
map:
  provider: maplibre
  style_url: https://tiles.openfreemap.org/styles/liberty
  style_url_dark: https://tiles.openfreemap.org/styles/fiord   # used when the UI is in dark mode
  attribution: "© OpenStreetMap contributors"
  center: [59.3293, 18.0686]
  zoom: 11
