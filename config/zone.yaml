# yaml-language-server: $schema=./schemas/zone.schema.json
# ─────────────────────────────────────────────────────────────
#  Zone analysis (Map → Zone): walking / cycling heatmaps along the street network.
#  Data: `findhome geo fetch network`, `timetable`, `poi`, `buildings`. Nothing here changes scores.
# ─────────────────────────────────────────────────────────────
speeds_mps: {walk: 1.3, bike: 4.2}   # 1.3 m/s ≈ 4.7 km/h; 4.2 m/s ≈ 15 km/h
factors:                          # speed multiplier per OSM highway class (stairs are slow)
  steps: 0.5
cutoff_min: 20                    # times above this are not computed (the segment is left grey)
bins_min: [2, 5, 8, 12, 16, 20]   # colour steps of the heatmap legend
snap_max_m: 300                   # a target or a home farther than this from any way is ignored
# A target set is what the heatmap measures the walk to: stops by transit mode (timetable) and/or POI categories.
target_sets:
  rail: {label: "Metro, train and tram", stops: [metro, commuter_rail, local_rail, tram, train]}
  bus: {label: Bus stops, stops: [bus]}
  ferry: {label: Ferry, stops: [ferry]}
  grocery: {label: Groceries, poi: [grocery]}
  pharmacy: {label: Pharmacies, poi: [pharmacy]}
  gym: {label: Gyms, poi: [gym, sats]}
  park: {label: Parks, poi: [park]}
  vet: {label: Vets, poi: [vet]}
# Homes weight the summary statistics ("typical home"): residential buildings, weighted by floors.
homes:
  buildings: [apartments, residential, house, detached, semidetached_house, terrace, dormitory]
  default_levels: {apartments: 4, residential: 3, dormitory: 3, terrace: 2}   # when building:levels is missing; else 1
# Zone indices (0-100). Transport: absolute components, each mapped linearly from `zero` (score 0) to `full` (score 1)
# and combined with its weight, per time window. The map colours zones by percentile.
indices:
  access_min: 10                  # stops within this walk of the zone's homes count for lines and frequency
  windows:                        # weekday hours [from, to) of each time window, and its weight in the average
    morning: {hours: [7, 9], weight: 1.0}
    midday: {hours: [9, 15], weight: 0.5}
    afternoon: {hours: [15, 19], weight: 1.0}
    evening: {hours: [19, 24], weight: 0.5}
  components:
    rail_access: {zero: 20, full: 5, weight: 1.0}    # minutes: home-weighted median walk to metro / train / tram
    bus_access: {zero: 10, full: 3, weight: 0.5}     # minutes: median walk to a bus stop
    coverage: {zero: 0, full: 1, weight: 0.5}        # share of homes within 5 min of any stop
    lines: {zero: 0, full: 15, weight: 1.0}          # distinct lines with a departure in the window (rail counts 3)
    frequency: {zero: 0, full: 60, weight: 1.0}      # departures per hour at the 3 busiest reachable stops
  # Services index (no transit): per set, proximity (median walk to the nearest, zero → full minutes) mixed with
  # choice (median number within choice.within_min minutes, 0 → choice.full) by choice.weight; then the sets'
  # weighted mean. A set weighs the highest poi.yaml weight among its categories (gym set: gym, sats).
  services:
    sets: [grocery, pharmacy, gym, park, vet]
    zero: 20                      # minutes: median walk to the nearest → score 0
    full: 5                       # minutes → score 1
    choice: {within_min: 10, full: 3, weight: 0.4}    # 3 or more within 10 min → full choice score
# Combined score (0-100): weighted mean of named index parts; add new parts here as they are built.
combined:
  parts: {transport: 0.5, services: 0.5}
# POI density per zone (Explore heatmaps): counts per this many home units (buildings weighted by floors) and per km².
density:
  per_homes: 1000
# House analysis (house page, 3D house view): walks from the exact address on the street network, no API calls.
house:
  cutoff_min: 30                  # walks above this are "none within reach" (long enough for a vet)
  sets: [grocery, pharmacy, gym, park, vet, rail, bus]
  services_depart: "10:00"        # weekday departure for "Compute transit routes" to the nearest services
  # The home's transport score = (1 − weight) × access (walks to rail / bus, lines, departures) + weight × reach.
  # Reach: per point of locations.yaml, the transit minutes from the home (cached ResRobot answers first, else the
  # Connectivity estimate), mapped good_min → 100 … bad_min → 0, averaged by point weight.
  reach: {weight: 0.6, good_min: 20, bad_min: 60}
# Walking minutes in the UI: green up to `green`, yellow up to `yellow`, red above.
walk_colours: {green: 5, yellow: 10}
# Connectivity centroids: the points each zone's commutes start from (Map → Connectivity, `findhome zone centroids`).
#   strategy: stops  the fewest free-placed circles of range_m (metres, radius) that cover every bus, tram, train,
#                    metro and ferry stop of the region; no stop is left out. A zone uses every circle within walk_min.
#   strategy: homes  per zone and group (rail, bus), the fewest stations that put `coverage` of its homes within
#                    walk_min; a station joins only while it adds `min_gain` of the homes.
centroids:
  strategy: stops
  walk_min: 5                     # ≈ 400 m at walking speed
  max_walk_min: 20                # walk times kept per home and centroid (longer walks are not a centroid's homes)
  coverage: 0.9                   # homes only
  min_gain: 0.03                  # homes only
  range_m: 200                    # stops: circle radius (200 m = 400 m diameter); also drawn in the zone view
  reference: true                 # homes only: a group with no station near keeps its best one within max_walk_min
  groups:
    rail: [metro, commuter_rail, local_rail, tram, train, ferry]
    bus: [bus]
