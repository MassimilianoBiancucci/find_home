# yaml-language-server: $schema=../../config/schemas/site.schema.json
# ─────────────────────────────────────────────────────────────
#  Blocket Bostad — origin-only. bostad.blocket.se serves Qasa's app (same robots.txt, same bot
#  checkpoint) and its rentals are published on Qasa with attributes.platform = "blocket". The site
#  is never scanned: it is registered so listings found on Qasa show where they were first published
#  (sites/qasa/site.yaml `platforms`). Probe notes: tasks/ planning folder, 2026-11-05.
# ─────────────────────────────────────────────────────────────
slug: blocket-bostad
name: Blocket Bostad
url: https://bostad.blocket.se
kinds: [rent]
status: disabled
role: origin
brand: {logo: null, colour: "#e5352d", favicon: "https://www.blocket.se/favicon.ico"}
scan:
  script: {enabled: false, reason: "served by Qasa's app (429 bot checkpoint); listings arrive through qasa"}
  browser: {enabled: false, reason: "listings arrive through the qasa scan (platform=blocket)"}
last_verified: '2026-11-05 (domain serves the Qasa app; housing listings published on Qasa)'
fetch:
  order: [api, http, playwright, agent_browser]
  method: null
  list_url_template: null
  api: {endpoint: null, method: GET, items_path: null, body: null}
  selectors: {}
  pagination: {type: page_param, param: page, max_pages: 1}
filter_map: {}
field_map: {}
pets: {filter_available: unknown, typical_wording: []}
auth: {mode: none}
politeness: {min_delay_s: 3, max_pages_per_run: 1, respect_robots: true, user_agent: findhome/0.1 (personal use)}
schedule: {interval: null}
notes: >-
  Origin only: Blocket's housing listings are published on Qasa (platform=blocket) and found by the qasa scan.
