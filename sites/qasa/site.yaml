# yaml-language-server: $schema=../../config/schemas/site.schema.json
# ─────────────────────────────────────────────────────────────
#  Qasa (qasa.com) — onboarded 2026-10-31 with the find-home skill (prompts/site_onboarding.md).
#  Search pages are server-rendered and embed the full result as Apollo SSR JSON, read by
#  sites/qasa/scanner.py. See NAVIGATION.md for the search flow and data anatomy.
#  Qasa also carries Blocket Bostad listings (attributes.platform = "blocket").
# ─────────────────────────────────────────────────────────────
slug: qasa
name: Qasa
url: https://qasa.com
kinds: [rent]
status: active
last_verified: '2026-10-31 (browser exploration; HTTP dry run pending on the Mac)'
fetch:
  order: [api, http, playwright, agent_browser]
  method: http                  # server-rendered HTML with embedded JSON; parsed by scanner.py
  list_url_template: https://qasa.com/se/sv/find-home
  fixed_params:
    searchAreas: Stockholms_län~~se     # whole county (Solna, Sundbyberg, Stockholm ...)
    sharedHome: privateHome             # own home only, no room in a shared flat
  api: {endpoint: null, method: GET, items_path: null, body: null}
  selectors: {}                  # not used: scanner.py reads the embedded JSON instead of HTML
  pagination: {type: page_param, param: page, max_pages: 5}   # ~59 listings per page, newest first
  details: {enabled: true, max_per_run: 15}   # floor, build year, balcony/elevator traits for NEW listings
filter_map:
  max_rent_sek: {param: maxMonthlyCost, note: monthly cost incl. tenant fee (Qasa monthlyCost)}
  min_size_m2: {param: minSquareMeters}
  min_rooms_rok: {param: minRoomCount, note: Qasa rum count (kitchen not counted) ≈ rok}
  pets_allowed: {param: rules, value_map: {'true': pets, 'false': null}, note: '"Husdjur tillåtet" = rules=pets'}
  accept_sovalkov: {param: null, local_only: true}
  areas_include: {param: null, local_only: true, note: search area is fixed_params.searchAreas; districts filtered locally}
  areas_exclude: {param: null, local_only: true}
  contract_types: {param: null, local_only: true, note: firstHand flag in the data; Qasa param contractTypes not verified}
  move_in_from: {param: null, local_only: true, note: 'Qasa param earliestMoveIn exists; format not verified'}
  move_in_to: {param: null, local_only: true}
  pet_status_exclude: {param: null, local_only: true}
  max_commute_min_by_category: {param: null, local_only: true}
field_map: {}                    # mapping lives in scanner.py document_to_listing()
pets:
  filter_available: 'yes'
  typical_wording: [Husdjur tillåtet, petsAllowed true/false in house rules, trait "pets" on the listing page]
auth: {mode: none}               # search and listing pages are public; contacting a landlord needs a Qasa login (you, never the agent)
politeness:
  min_delay_s: 3
  max_pages_per_run: 5
  # robots.txt disallows find-home URLs with filter parameters (maxMonthlyCost, minRoomCount,
  # sharedHome, rules ...). Ignored on the user's explicit instruction (2026-10-31): personal,
  # low-volume use with a 3 s delay and at most 5 result pages + 15 detail pages per run.
  respect_robots: false
  user_agent: findhome/0.1 (personal home search)
schedule: {interval: 6h}         # suggestion for your external scheduler
notes: >-
  Second-hand (andrahand) and some first-hand rentals, Sweden-wide; includes Blocket Bostad listings.
  Strong pets support: filter "Husdjur tillåtet" (rules=pets) and petsAllowed per listing.
