# yaml-language-server: $schema=../../config/schemas/site.schema.json
# ─────────────────────────────────────────────────────────────
#  Samtrygg — browser-only, onboarded 2026-11-05 with the site_onboarding profile in your Chrome.
#  Probe 2026-11-05: plain GETs are answered (no bot protection); robots.txt disallows the search
#  pages (/RentalObject/Search, /RentalObject/NewSearch), which the browser scan reads anyway by the
#  user's decision (risk_note); the pages are filled by JavaScript. So no scripted scanner: sites/samtrygg/extract.js
#  reads each RENDERED search page (24 cards, by URL page=N), and to_listing() in scanner.py converts the cards.
#  Each listing shows a "Husdjur ok" badge: extract.js returns it as the site's pet flag.
# ─────────────────────────────────────────────────────────────
slug: samtrygg
name: Samtrygg
url: https://www.samtrygg.se
kinds: [rent]
status: active
role: scanned
risk_note: >-
  robots.txt disallows the search pages (/RentalObject/Search, /RentalObject/NewSearch); the user decided
  (2026-11-05) that the browser scan reads them anyway: started by hand in the user's own Chrome, the
  whole Stockholm search by URL, at most 20 result pages, 3 s apart, never on a schedule. No terms page found.
brand: {logo: null, colour: "#2a7de1"}
scan:
  script: {enabled: false, reason: "listings are rendered by JavaScript: no data in the HTML a script gets"}
  browser:
    enabled: true
    extractor: extract.js
    default_pages: 20
    max_pages: 20               # the whole Stockholm set (259 on 2026-11-16, 24 per page: 11 pages) fits the cap
last_verified: '2026-11-19 (search by URL: /RentalObject/NewSearch?place=Stockholm&sort=newest&page=N, 24 cards per page)'
fetch:
  order: [api, http, playwright, agent_browser]
  method: agent_browser
  list_url_template: https://www.samtrygg.se/RentalObject/NewSearch
  fixed_params: {place: Stockholm, sort: newest}      # an explicit sort keeps the order stable between pages
  api: {endpoint: null, method: GET, items_path: null, body: null}
  selectors: {}                 # not used: extract.js reads the rendered cards (article.listing-card)
  pagination: {type: page_param, param: page, page_size: 24, max_pages: 20}
  url_filter_policy: {mode: never, expected_total_unfiltered: 259, measured: '2026-11-16'}   # fits the cap: no URL filter
filter_map:                     # every filter is applied in the database (url_filter_policy never)
  max_rent_sek: {param: null, local_only: true}
  min_size_m2: {param: null, local_only: true}
  min_rooms_rok: {param: null, local_only: true}
  pets_allowed: {param: null, local_only: true, note: cards carry a Husdjur ok tag; pets are decided in the database}
  areas_include: {param: null, local_only: true}
  contract_types: {param: null, local_only: true}
  move_in_from: {param: null, local_only: true, note: the Önskat tillträde field is read-only; no date in the URL}
  move_in_from_slack_days: {param: null, local_only: true}
field_map: {}                   # api method: ListingIn field → JSON path, e.g. rent_sek: price.amount
pets: {filter_available: 'no', typical_wording: [Husdjur ok]}
auth: {mode: none}              # none | browser_session (agent uses your logged-in browser; never store credentials)
politeness: {min_delay_s: 3, max_pages_per_run: 20, respect_robots: false, user_agent: findhome/0.1 (personal use)}
schedule: {interval: null}      # started by hand only (risk_note)
notes: >-
  Second-hand rentals with landlord vetting and contract handling. The search page
  /RentalObject/NewSearch?place=Stockholm&sort=newest&page=N lists every Stockholm ad, 24 per page, with a counter
  ("Visar 259 bostäder"). The date field (Önskat tillträde) is read-only, so dates are never typed: every page is read
  and the database filters. Cards carry a "Husdjur ok" tag when pets are allowed.
